[project]
name = "app"
version = "0.1.0"
description = "Project overview goes here."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "example-app",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: deselect with -m 'not slow'",
    "integration: requires Docker / external services",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "ty>=0.0.39",
]

[tool.uv]
# Virtual workspace root: it coordinates the members below but is not itself
# an installable package, so `uv sync` works before you add any src/.
package = false

[tool.uv.workspace]
# Glob discovery — drop libraries under packages/, deployables under apps/.
# Each member needs its own pyproject.toml; empty globs are fine until then.
members = ["packages/*", "apps/*"]

[tool.uv.sources]
example-app = { workspace = true }
example-core = { workspace = true }
