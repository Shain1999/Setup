[project]
name = "example-app"
version = "0.1.0"
description = "Deployable app — replace with your own."
requires-python = "==3.14.*"
dependencies = [
    "example-core",
]

[project.scripts]
example-app = "example_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_app"]

[tool.uv.sources]
example-core = { workspace = true }
